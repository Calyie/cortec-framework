[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Calister Nnona", email = "calisternnona@gmail.com"}]
name = "cortec"
version = "0.3.0"
description = "Differentially private synthetic tabular data from a frozen LLM conditioned only on DP statistics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# These two were advertised in the README and never defined here, so `pip install cortec[openai]`
# and `cortec[gemini]` installed no SDK at all -- pip warns about an unknown extra and proceeds,
# so the failure surfaced only at the first API call. Floors are set by the API surface generate.py
# uses: `reasoning_effort` on chat.completions, and ThinkingConfig/GenerateContentConfig on the
# google-genai client (NOT the older google-generativeai package).
openai = ["openai>=1.60"]
gemini = ["google-genai>=1.0"]
# Enterprise surfaces (the recommended deployment): the same SDKs, plus request signing for
# Bedrock. Azure OpenAI and Vertex AI need nothing beyond their vendor SDK.
bedrock = ["anthropic[bedrock]>=0.40"]
azure = ["openai>=1.60"]
vertex = ["google-genai>=1.0"]
ollama = ["httpx>=0.27"]
dev = ["pytest>=7", "scikit-learn>=1.3"]

# No console script. An earlier version declared `cortec = "cortec.cli:main"` with no cli module
# behind it, so every install placed a `cortec` executable on PATH that failed on import. The
# package is a library; the parity audit now checks that any declared entry point resolves.

[tool.setuptools.packages.find]
where = ["."]
include = ["cortec*"]
